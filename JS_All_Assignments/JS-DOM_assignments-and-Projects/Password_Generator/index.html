<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <form action="">
            <div class="input">
                <input id="passwordInput" type="password">
                <i></i>
                <div class="input-txt">
                    <p id="passwordStatus"> </p>
                </div>
            </div>
            <div class="input-range">
                <input type="range" name="" id="passwordRange">
                <div class="range-number">
                    <p id="rangeNumber"></p>
                </div>
            </div>
            <div class="checkBoxes">
                <div class="uppercase_checkbox">
                    <input type="checkbox" name="upperCase" id="upperCase-input">
                    <label for="upperCase">UpperCase</label>
                </div>
                <div class="lowercase_checkbox">
                    <input type="checkbox" name="lowerCase" id="lowerCase-input">
                    <label for="lowerCase">LowerCase</label>
                </div>
                <div class="number_checkbox">
                    <input type="checkbox" name="number" id="number-input">
                    <label for="number">Number</label>
                </div>
                <div class="character_checkbox">
                    <input type="checkbox" name="character" id="character-input">
                    <label for="character">Character</label>
                </div>
            </div>

            <div class="generate-button">
                <button id="generate-btn" onclick="generatePassword()">Generate Password</button>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
